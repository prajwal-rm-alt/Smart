<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" />

  <!-- Glass Inner Panel -->
  <rect x="64" y="64" width="384" height="384" rx="64" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />

  <!-- OTG & Airfryer Stylized Symbolism -->
  <!-- Airfryer Vortex / Fan Arc -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-dasharray="24 16" filter="url(#glow)" />
  
  <!-- Outer Appliance Chamber Frame -->
  <rect x="120" y="140" width="272" height="232" rx="36" fill="#0f172a" fill-opacity="0.6" stroke="#94a3b8" stroke-width="6" />

  <!-- Glass Window of Appliance -->
  <rect x="144" y="168" width="224" height="150" rx="20" fill="#1e293b" fill-opacity="0.8" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="3" />

  <!-- Glowing Top & Bottom Heating Rods (OTG) -->
  <line x1="168" y1="196" x2="344" y2="196" stroke="url(#flameGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <line x1="168" y1="290" x2="344" y2="290" stroke="url(#flameGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Modern Digital Display / Knob Indicator -->
  <circle cx="256" cy="243" r="32" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="4" />
  <path d="M256 225 L256 243 L268 250" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Apple-like Glass Highlight Reflection -->
  <path d="M 64 128 Q 256 180 448 128 L 448 64 L 64 64 Z" fill="#ffffff" fill-opacity="0.08" />
</svg>
