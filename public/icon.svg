<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Black Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="45%" stop-color="#070709" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Ambient White Radial Backlight for Glassmorphism Depth -->
    <radialGradient id="ambientWhiteGlow" cx="65%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- iOS Specular Rim Border Gradient -->
    <linearGradient id="rimBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <!-- Frosted Glass Plate Surface -->
    <linearGradient id="glassPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glassmorphic Bar Gradients (Translucent White) -->
    <linearGradient id="barGlass1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="barGlass2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="barGlass3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.26" />
    </linearGradient>

    <!-- Pure Glossy White Sales Trend Line -->
    <linearGradient id="trendWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Soft White Glow Filter -->
    <filter id="whiteGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Obsidian Black Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#obsidianBg)" />

  <!-- Subtle Ambient White Back-Glow -->
  <circle cx="320" cy="180" r="210" fill="url(#ambientWhiteGlow)" />

  <!-- Outer iOS Specular Edge Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rimBorder)" stroke-width="3.5" />

  <!-- Inner Floating Frosted Glassmorphism Card -->
  <rect
    x="68"
    y="68"
    width="376"
    height="376"
    rx="76"
    fill="url(#glassPlate)"
    stroke="url(#rimBorder)"
    stroke-width="2.5"
    filter="url(#cardShadow)"
  />

  <!-- Subtle Glass Grid Baseline -->
  <line x1="116" y1="376" x2="396" y2="376" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" />

  <!-- Bar 1 (Left - Short Frosted Glass Column) -->
  <rect
    x="132"
    y="276"
    width="56"
    height="100"
    rx="16"
    fill="url(#barGlass1)"
    stroke="#ffffff"
    stroke-opacity="0.4"
    stroke-width="2"
  />

  <!-- Bar 2 (Middle - Medium Frosted Glass Column) -->
  <rect
    x="228"
    y="214"
    width="56"
    height="162"
    rx="16"
    fill="url(#barGlass2)"
    stroke="#ffffff"
    stroke-opacity="0.55"
    stroke-width="2"
  />

  <!-- Bar 3 (Right - Tall Bright Glass Column) -->
  <rect
    x="324"
    y="148"
    width="56"
    height="228"
    rx="16"
    fill="url(#barGlass3)"
    stroke="#ffffff"
    stroke-opacity="0.75"
    stroke-width="2.5"
  />

  <!-- Frosted Glass Floating Badge Pill (Top-Left Accent) -->
  <rect
    x="116"
    y="114"
    width="96"
    height="38"
    rx="19"
    fill="#ffffff"
    fill-opacity="0.12"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="1.5"
  />
  <circle cx="140" cy="133" r="6" fill="#ffffff" fill-opacity="0.9" />
  <line x1="156" y1="133" x2="192" y2="133" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" />

  <!-- Ascending Glassy White Sales Trend Line & Arrow (📈) -->
  <g filter="url(#whiteGlow)">
    <path
      d="M 136 248 L 214 186 L 268 212 L 368 118"
      fill="none"
      stroke="url(#trendWhite)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Arrowhead -->
    <path
      d="M 322 116 L 372 114 L 370 164"
      fill="none"
      stroke="#ffffff"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Crisp Glass Nodes on Trend Line -->
  <circle cx="136" cy="248" r="9" fill="#09090b" stroke="#ffffff" stroke-width="5" />
  <circle cx="214" cy="186" r="9" fill="#09090b" stroke="#ffffff" stroke-width="5" />
  <circle cx="268" cy="212" r="9" fill="#09090b" stroke="#ffffff" stroke-width="5" />

  <!-- Top Glossy iOS Crown Specular Reflection -->
  <path
    d="M 68 136 Q 256 185 444 136 L 444 96 Q 444 68 416 68 L 96 68 Q 68 68 68 96 Z"
    fill="#ffffff"
    fill-opacity="0.07"
  />
</svg>
